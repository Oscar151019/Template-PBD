<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestión de Solicitudes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f6f9;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .fallback-box {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #495057;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #dee2e6;
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-direct {
      margin-top: 16px;
      padding: 12px 20px;
      background: #0d6efd;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 3px 10px rgba(13, 110, 253, 0.25);
    }
    iframe {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="fallback-box">
    <div class="spinner"></div>
    <div>Abriendo formulario de solicitudes...</div>
    <small style="margin-top: 6px; color: #6c757d;">Si no carga automáticamente en 5 segundos, toca el botón:</small>
    <a class="btn-direct" href="https://script.google.com/macros/s/AKfycbwarf1blsux_9W71zyZs8geGTohQLp3DS3kJHRwvVSdWRDp1cdrlFGYL0R7ZWmeUwOH/exec">
      Abrir formulario directamente
    </a>
  </div>

  <iframe id="appFrame" allow="geolocation *; camera *; microphone *" allowfullscreen></iframe>

  <script>
    (async function () {
      const EXEC_URL = "https://script.google.com/macros/s/AKfycbwarf1blsux_9W71zyZs8geGTohQLp3DS3kJHRwvVSdWRDp1cdrlFGYL0R7ZWmeUwOH/exec";
      const ua = navigator.userAgent || "";

      const isBrave = !!(navigator.brave && await navigator.brave.isBrave());
      // Solo Google Chrome (Android/PC) usa iframe; Edge y los demás navegadores van directo a /exec
      const isGoogleChrome = /Chrome/i.test(ua) && !/Edg|EdgA|EdgiOS|OPR|Opera|SamsungBrowser|UCBrowser|Vivaldi|DuckDuckGo|CriOS/i.test(ua) && !isBrave;

      if (!isGoogleChrome) {
        window.location.replace(EXEC_URL);
        return;
      }

      const frame = document.getElementById("appFrame");
      frame.style.display = "block";
      frame.src = EXEC_URL;
    })();
  </script>
</body>
</html>
